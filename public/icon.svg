<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="url(#glowGrad)" />

  <!-- Wallet Body -->
  <g transform="translate(96, 120)">
    <!-- Back leather fold -->
    <rect x="0" y="40" width="320" height="220" rx="36" fill="#1e293b" stroke="#334155" stroke-width="8" />
    
    <!-- Top card peaking -->
    <rect x="36" y="10" width="248" height="60" rx="16" fill="url(#emeraldGrad)" />

    <!-- Wallet front flap -->
    <rect x="0" y="70" width="320" height="190" rx="32" fill="#0f172a" stroke="#10b981" stroke-width="6" />

    <!-- Trend line / arrow -->
    <path d="M40 180 L120 120 L180 150 L260 90" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="220,90 260,90 260,130" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Clasp / Lock with Coin -->
    <g transform="translate(240, 135)">
      <rect x="-30" y="-25" width="70" height="50" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4" />
      <circle cx="5" cy="0" r="14" fill="#fbbf24" stroke="#f59e0b" stroke-width="3" />
      <text x="5" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">R$</text>
    </g>
  </g>
</svg>
